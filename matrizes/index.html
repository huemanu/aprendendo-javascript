<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Matrizes</title>
</head>
<body>
    <div class="centralizar-horizontal">
        <h1>Matrizes</h1>

        <div class="criar-matriz centralizar-horizontal">
            <h3>Criar Matriz</h3>
            <div class="criar-matriz-inputs-container">
                <label for="altura">Altura: </label>
                <label for="largura">Largura: </label>
                <div></div>
                <input type="text" name="altura" class="input-criar-tabela">
                <input type="text" name="largura" class="input-criar-tabela">
                <input type="submit" name="submit" value="Criar">
            </div>
            <div class="criar-matriz-conteudo-container">
                <div class="linha-container">
                    <div class="elemento-container">
                        <input type="text" name="elemento" id="elemento">
                    </div>
                </div>
            </div>
        </div>

        <div class="lista-igualdades-container">
            <div class="matriz-container centralizar-horizontal centralizar-vertical">
                <div class="linha-container">
                    <div class="elemento-container">
                        1
                    </div>
                    <div class="elemento-container">
                        2
                    </div>
                    <div class="elemento-container">
                        3
                    </div>
                </div>
                <div class="linha-container">
                    <div class="elemento-container">
                        4
                    </div>
                    <div class="elemento-container">
                        5
                    </div>
                    <div class="elemento-container">
                        6
                    </div>
                </div>
                <div class="linha-container">
                    <div class="elemento-container">
                        7
                    </div>
                    <div class="elemento-container">
                        8
                    </div>
                    <div class="elemento-container">
                        9
                    </div>
                </div>
            </div>

        </div>
        
    </div>
</body>
</html>
